# Overrides solo para los tests. No contiene secretos reales.
# @WebMvcTest no levanta JPA/DataSource, así que estos valores nunca se conectan.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gestix_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: email, profile
          microsoft:
            client-id: test-microsoft-client-id
            client-secret: test-microsoft-client-secret
            client-name: Microsoft
            scope: openid, email, profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

server:
  port: 0

gestix:
  app-url: http://localhost:8080
  mail:
    enabled: false
    from: noreply@gestix.test
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000

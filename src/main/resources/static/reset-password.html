<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestix — Nueva contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background:
                radial-gradient(ellipse 60% 55% at 12% 12%, rgba(165,180,252,.55) 0%, transparent 60%),
                radial-gradient(ellipse 70% 55% at 88% 88%, rgba(196,181,253,.55) 0%, transparent 60%),
                linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
            min-height: 100vh;
        }
        .field-wrap { position: relative; }
        .field-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            width: 18px; height: 18px; color: #9ca3af; pointer-events: none;
        }
        .field {
            width: 100%; padding: 12px 16px 12px 44px; border-radius: 11px;
            border: 1.5px solid #e5e7eb; background: #fafafa; font-size: .9375rem; color: #111827;
        }
        .field:focus {
            outline: none; border-color: #6366f1; background: white;
            box-shadow: 0 0 0 4px rgba(99,102,241,.12);
        }
        .eye-btn {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #9ca3af; padding: 4px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            box-shadow: 0 10px 24px -6px rgba(99,102,241,.55);
        }
        .card-enter {
            animation: card-in .55s cubic-bezier(.21,1.02,.73,1) both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(20px) scale(.98); }
            to   { opacity: 1; transform: none; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

<main class="card-enter w-full max-w-md bg-white rounded-[24px] shadow-2xl shadow-violet-200/60 p-8">

    <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto mb-4 rounded-2xl flex items-center justify-center text-white font-black text-xl"
             style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">G</div>
        <h1 class="text-2xl font-black text-gray-900">Nueva contraseña</h1>
        <p class="text-sm text-gray-400 mt-1">Elige una contraseña segura de al menos 6 caracteres</p>
    </div>

    <form id="resetForm" onsubmit="handleResetPassword(event)" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Nueva contraseña</label>
            <div class="field-wrap">
                <svg class="field-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 11c1.1 0 2 .9 2 2v3a2 2 0 11-4 0v-3c0-1.1.9-2 2-2zm6 0V8a6 6 0 10-12 0v3"/></svg>
                <input type="password" id="resetPassword" placeholder="Mínimo 6 caracteres" required minlength="6" class="field" autocomplete="new-password">
            </div>
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5">Confirmar contraseña</label>
            <div class="field-wrap">
                <svg class="field-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 11c1.1 0 2 .9 2 2v3a2 2 0 11-4 0v-3c0-1.1.9-2 2-2zm6 0V8a6 6 0 10-12 0v3"/></svg>
                <input type="password" id="resetPasswordConfirm" placeholder="Repite la contraseña" required minlength="6" class="field" autocomplete="new-password">
            </div>
        </div>

        <div id="resetError" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-lg px-3.5 py-2.5 text-sm"></div>
        <div id="resetSuccess" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg px-3.5 py-2.5 text-sm"></div>

        <button type="submit" class="btn-primary w-full text-white font-black py-3 rounded-xl text-[15px]">
            Guardar contraseña
        </button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-5">
        <a href="login.html" class="text-indigo-600 font-bold hover:text-indigo-700">Ir al inicio de sesión</a>
    </p>
</main>

<script src="js/auth.js"></script>
<script>
    if (!new URLSearchParams(window.location.search).get('token')) {
        document.getElementById('resetError').textContent = 'Enlace inválido o incompleto. Solicita uno nuevo desde el login.';
        document.getElementById('resetError').classList.remove('hidden');
        document.getElementById('resetForm').classList.add('hidden');
    }
</script>
</body>
</html>
